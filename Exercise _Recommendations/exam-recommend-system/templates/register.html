{% extends "base.html" %}
{% from "_icons.html" import icon %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-mark">{{ icon('user-plus', 'icon-xl') }}</div>
            <h2>用户注册</h2>
        </div>
        <form method="POST" action="/register">
            <div class="form-group">
                <label for="username">{{ icon('user') }} 用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" required>
            </div>
            <div class="form-group">
                <label for="password">{{ icon('lock') }} 密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">{{ icon('check') }} 确认密码</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="请再次输入密码" required>
            </div>
            {% if error %}
            <div class="alert alert-error" role="alert">{{ icon('warning') }}<span>{{ error }}</span></div>
            {% endif %}
            <button type="submit" class="btn-primary btn-block">
                {{ icon('user-plus') }} 注册账号
            </button>
        </form>
        <div class="auth-footer">
            <p>已有账号？ <a href="/login">立即登录</a></p>
        </div>
    </div>
</div>
{% endblock %}
